<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing Calculator — VoxPrice</title><meta name="description" content="VoxPrice turns spoken orders into accurate, editable price quotes."><meta name="theme-color" content="#635BFF"><link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css"><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/themes.css"><link rel="stylesheet" href="../css/animations.css"><link rel="stylesheet" href="../css/navbar.css"><link rel="stylesheet" href="../css/sidebar.css"><link rel="stylesheet" href="../css/dashboard.css"><link rel="stylesheet" href="../css/tables.css"><link rel="stylesheet" href="../css/pricing.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="/api/cms/theme.css"><script src="../js/theme.js"></script></head>
<body class="app" data-page="pricing-calculator" data-root="../"><a class="skip-link" href="#content">Skip to content</a>
<div class="app-shell"><aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside><div class="app-main"><header id="topbar" class="topbar"></header>
<main id="content" class="content page-enter"><div class="page-title"><div><h1>Pricing Calculator</h1><p>Build a price step by step. The preview updates as you type.</p></div><div class="row"></div></div><div class="calc-layout"><form class="card" id="calc-form" novalidate data-reveal><datalist id="catalog-list"></datalist><div class="form-grid">
<div class="field full"><label for="product">Product</label><input class="input" id="product" name="product" list="catalog-list" placeholder="Choose from the catalog or type a custom item" autocomplete="off"><span class="field-hint" id="unit-hint"></span><span class="field-error" role="alert"></span></div>
<div class="field full"><label for="customer">Customer (optional)</label><select class="select" id="customer" name="customer"></select><span class="field-error"></span></div>
<div class="field "><label for="quantity">Quantity</label><input class="input" id="quantity" name="quantity" type="number" min="0" step="any"><span class="field-error" role="alert"></span></div><div class="field "><label for="unitPrice">Unit price</label><input class="input" id="unitPrice" name="unitPrice" type="number" min="0" step="any"><span class="field-error" role="alert"></span></div><div class="field "><label for="discount">Discount (%)</label><input class="input" id="discount" name="discount" type="number" min="0" max="100" step="any"><span class="field-error" role="alert"></span></div><div class="field "><label for="tax">Tax (%)</label><input class="input" id="tax" name="tax" type="number" min="0" max="100" step="any"><span class="field-error" role="alert"></span></div><div class="field "><label for="delivery">Delivery charges</label><input class="input" id="delivery" name="delivery" type="number" min="0" step="any"><span class="field-error" role="alert"></span></div><div class="field "><label for="extra">Additional charges</label><input class="input" id="extra" name="extra" type="number" min="0" step="any"><span class="field-error" role="alert"></span></div></div>
<div class="row" style="margin-top:var(--space-5)"><button class="btn btn-primary" type="submit" id="btn-calc"><span class="ic " data-icon="calc"></span>Calculate price</button><button class="btn btn-secondary" type="button" id="btn-reset"><span class="ic " data-icon="refresh"></span>Reset</button></div></form>
<aside class="card summary" data-reveal style="--i:1"><div class="card-head"><h3>Price summary</h3></div>
<div class="summary-line"><span>Subtotal</span><span id="sum-subtotal"></span></div><div class="summary-line"><span>Discount</span><span id="sum-discount"></span></div><div class="summary-line"><span>Tax</span><span id="sum-tax"></span></div><div class="summary-line"><span>Delivery charges</span><span id="sum-delivery"></span></div><div class="summary-line"><span>Additional charges</span><span id="sum-extra"></span></div>
<div class="summary-total"><span>Final total</span><strong id="sum-total"></strong></div><p class="xs muted" id="calc-state" style="margin:.6rem 0 1rem"></p>
<div class="stack" style="gap:.6rem"><button class="btn btn-secondary btn-block" id="btn-save" type="button" disabled><span class="ic " data-icon="check"></span>Save calculation</button><button class="btn btn-secondary btn-block" id="btn-quote" type="button" disabled><span class="ic " data-icon="file"></span>Generate quotation</button></div></aside></div></main></div></div><div id="toast-root"></div><script src="../js/env.js"></script><script src="../js/utils.js"></script><script src="../js/notifications.js"></script><script src="../js/data.js"></script><script src="../js/api.js"></script><script src="../js/charts.js"></script><script src="../js/table.js"></script><script src="../js/app.js"></script><script src="../js/pricing-calculator.js"></script></body></html>
