<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — VoxPrice</title><meta name="description" content="VoxPrice turns spoken orders into accurate, editable price quotes."><meta name="theme-color" content="#635BFF"><link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css"><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/themes.css"><link rel="stylesheet" href="../css/animations.css"><link rel="stylesheet" href="../css/navbar.css"><link rel="stylesheet" href="../css/sidebar.css"><link rel="stylesheet" href="../css/dashboard.css"><link rel="stylesheet" href="../css/tables.css"><link rel="stylesheet" href="../css/pricing.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="/api/cms/theme.css"><script src="../js/theme.js"></script></head>
<body class="app" data-page="profile" data-root="../"><a class="skip-link" href="#content">Skip to content</a>
<div class="app-shell"><aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside><div class="app-main"><header id="topbar" class="topbar"></header>
<main id="content" class="content page-enter"><div class="page-title"><div><h1>My profile</h1><p>Your details and password.</p></div><div class="row"></div></div><div id="profile-root" class="grid split"><div class="stack"><section class="card" data-reveal><div class="row" style="margin-bottom:var(--space-4)"><span class="avatar" id="pf-avatar" style="width:64px;height:64px;font-size:1.3rem"></span><div><h2 id="pf-name-h"></h2><span class="badge badge-info" id="pf-role"></span></div></div>
<form id="profile-form" novalidate class="form-grid"><div class="field"><label for="p-name">Full name</label><input class="input" id="p-name" name="name"><span class="field-error"></span></div><div class="field"><label for="p-email">Email</label><input class="input" id="p-email" name="email" type="email"><span class="field-error"></span></div><div class="field"><label for="p-company">Company</label><input class="input" id="p-company" name="company"></div><div class="field"><label for="p-phone">Phone</label><input class="input" id="p-phone" name="phone" type="tel"></div><div class="full"><button class="btn btn-primary" type="submit">Save profile</button></div></form></section>
<section class="card" data-reveal><div class="card-head"><h3>Change password</h3></div><form id="pw-form" novalidate class="form-grid"><div class="field full"><label for="pw-c">Current password</label><input class="input" id="pw-c" name="current" type="password" autocomplete="current-password"><span class="field-error"></span></div><div class="field"><label for="pw-n">New password</label><input class="input" id="pw-n" name="next" type="password" autocomplete="new-password"><span class="field-error"></span></div><div class="field"><label for="pw-cf">Confirm new password</label><input class="input" id="pw-cf" name="confirm" type="password" autocomplete="new-password"><span class="field-error"></span></div><div class="full"><button class="btn btn-primary" type="submit">Update password</button></div></form></section></div>
<aside class="card" data-reveal style="--i:1;align-self:start"><div class="card-head"><h3>Your activity</h3></div><div class="row between"><span class="muted">Calculations</span><b id="pf-calcs"></b></div><div class="divider"></div><div class="row between"><span class="muted">Quotations</span><b id="pf-quotes"></b></div></aside></div></main></div></div><div id="toast-root"></div><script src="../js/env.js"></script><script src="../js/utils.js"></script><script src="../js/notifications.js"></script><script src="../js/data.js"></script><script src="../js/api.js"></script><script src="../js/charts.js"></script><script src="../js/table.js"></script><script src="../js/app.js"></script><script src="../js/settings.js"></script></body></html>
