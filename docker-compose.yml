# Optional: a ready-made PostgreSQL for local use.  Start it with:  docker compose up -d db
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: voxprice
      POSTGRES_PASSWORD: voxprice
      POSTGRES_DB: voxprice
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxprice"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
